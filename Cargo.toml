[package]
name = "pocowl"
version = "0.1.0"
edition = "2024"
authors = ["Po Co<me@polnio.dev>"]

[lib]
proc-macro = true

[dependencies]
anchovy = "0.1.0"
anyhow = "1.0.102"
async-trait = "0.1.89"
byteorder = "1.5.0"
crossbeam = "0.8.4"
fixed = "1.31.0"
memmap = "0.7.0"
num_enum = "0.7.6"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
# Scanner
convert_case = "0.11.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.8.2"
syn = "2.0.117"
# GLFW backend
glfw = { version = "0.62.0", optional = true }
ouroboros = { version = "0.18.5", optional = true }
softbuffer = { version = "0.4.8", optional = true }
clap = { version = "4.6.1", features = ["derive"] }

[features]
backend-glfw  = ["dep:glfw", "dep:ouroboros", "dep:softbuffer"]
backend-dummy = []
